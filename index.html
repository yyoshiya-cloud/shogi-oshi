    <script>
      // In AI Studio Cloud Run / iframe preview, HMR is disabled and Vite dev client
      // WebSocket disconnections are expected and benign (as specified in runtime constraints: "HMR: Disabled. Ignore WebSocket errors.")
      (function () {
        function isViteWsMessage(arg) {
          if (!arg) return false;
          const str = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack || ''));
          const text = String(str);
          return text.includes('WebSocket') || text.includes('[vite]') || text.includes('closed without opened') || text.includes('server connection lost');
        }

        const origConsoleError = console.error;
        console.error = function (...args) {
          if (args.some(isViteWsMessage)) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function (...args) {
          if (args.some(isViteWsMessage)) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function (e) {
          const msg = e && (e.message || (e.error && (e.error.message || e.error.stack)) || '');
          if (isViteWsMessage(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          const reason = e && (e.reason ? (e.reason.message || e.reason.stack || e.reason) : '');
          if (isViteWsMessage(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
