<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="50%" stop-color="#141312" />
      <stop offset="100%" stop-color="#0d0c0b" />
    </linearGradient>

    <!-- Shogi Wood Grain Gradient -->
    <linearGradient id="komaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc8" />
      <stop offset="35%" stop-color="#ecd19d" />
      <stop offset="70%" stop-color="#d6b170" />
      <stop offset="100%" stop-color="#be934c" />
    </linearGradient>

    <linearGradient id="komaBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="10%" stop-color="#faecc8" stop-opacity="0.2" />
      <stop offset="90%" stop-color="#69430e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#412705" stop-opacity="0.8" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c7" />
      <stop offset="40%" stop-color="#e8bd4b" />
      <stop offset="70%" stop-color="#c99525" />
      <stop offset="100%" stop-color="#98680d" />
    </linearGradient>

    <!-- Heart Accent Gradient (推し / Oshikatsu) -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="50%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#c9184a" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle tatami grid and rounded corner -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background decorative lattice/fan circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#e8bd4b" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.25" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#e8bd4b" stroke-width="1" opacity="0.15" />

  <!-- Shogi Piece Shape (Pentagon) -->
  <!-- Coordinates tuned for authentic Shogi piece proportion -->
  <g filter="url(#shadow)">
    <!-- Base Koma -->
    <polygon points="256,64 366,138 344,410 168,410 146,138" fill="url(#komaGrad)" stroke="#69430e" stroke-width="3" stroke-linejoin="round" />
    <!-- Bevel highlight -->
    <polygon points="256,64 366,138 344,410 168,410 146,138" fill="url(#komaBevel)" mix-blend-mode="overlay" />
    
    <!-- Inner Koma Border line -->
    <polygon points="256,80 352,146 333,394 179,394 160,146" fill="none" stroke="#946320" stroke-width="2" stroke-opacity="0.4" />

    <!-- Authentic Shogi Kanji "王" (King) or "推" (Oshi) stylized -->
    <g fill="#1a140e" stroke="#1a140e" stroke-linejoin="round">
      <!-- "推" Character on Koma (combining Shogi tradition + Oshikatsu passion) -->
      <!-- Left radical: 扌(てへん) -->
      <path d="M 200,165 L 228,162 M 216,145 L 216,250 Q 216,260 206,262 M 198,242 L 230,210" stroke="#1a140e" stroke-width="8" stroke-linecap="round" fill="none" />
      <!-- Right radical: 隹(ふるとり) -->
      <path d="M 268,142 Q 256,158 244,168 M 264,160 L 302,154 M 274,162 L 274,260 M 274,188 L 312,183 M 274,212 L 310,208 M 274,237 L 312,233 M 250,264 L 322,258" stroke="#1a140e" stroke-width="7" stroke-linecap="round" fill="none" />
      
      <!-- Bottom piece subtitle kanji: "将" (General/Shogi) in classic calligraphy look -->
      <path d="M 215,295 L 215,365 M 205,315 L 225,315 M 245,295 L 295,295 M 268,295 L 268,368 Q 268,375 258,375 M 240,325 L 298,325 M 282,340 L 302,360" stroke="#1a140e" stroke-width="7" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Oshikatsu glowing heart badge on top corner -->
  <g transform="translate(325, 290) scale(1.1)" filter="url(#glow)">
    <circle cx="28" cy="28" r="32" fill="#2d151c" stroke="#ff758f" stroke-width="2" />
    <path d="M 28,42 C 16,30 12,22 12,16 C 12,10 16,6 22,6 C 25,6 27,8 28,10 C 29,8 31,6 34,6 C 40,6 44,10 44,16 C 44,22 40,30 28,42 Z" fill="url(#heartGrad)" />
    <!-- Small star twinkle -->
    <path d="M 38,10 L 40,14 L 44,16 L 40,18 L 38,22 L 36,18 L 32,16 L 36,14 Z" fill="#fff" opacity="0.9" />
  </g>

  <!-- Notification Sparkle badge on top right -->
  <g transform="translate(350, 75)">
    <circle cx="24" cy="24" r="20" fill="#dc2626" stroke="#fef08a" stroke-width="2" />
    <!-- Bell icon -->
    <path d="M 24,14 C 20,14 17,17 17,21 C 17,27 14,29 14,29 L 34,29 C 34,29 31,27 31,21 C 31,17 28,14 24,14 Z" fill="#ffffff" />
    <circle cx="24" cy="32" r="2.5" fill="#ffffff" />
  </g>
</svg>
