<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a2219" />
      <stop offset="60%" stop-color="#14110e" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>

    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Premium Wood Piece Gradient -->
    <linearGradient id="komaWood" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef3c7" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Wood Bevel Highlight -->
    <linearGradient id="komaBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="85%" stop-color="#451a03" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#290f02" stop-opacity="0.8" />
    </linearGradient>

    <!-- Oshi Ruby Heart Gradient -->
    <linearGradient id="rubyHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="45%" stop-color="#ff2e54" />
      <stop offset="100%" stop-color="#990024" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="komaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>

    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff2e54" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle / Rounded Container) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer Decorative Golden Ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#goldRim)" stroke-width="4" opacity="0.4" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Center Shogi Piece (Koma) Group -->
  <g filter="url(#komaShadow)" transform="translate(0, 4)">
    <!-- Pentagon Shogi Piece -->
    <!-- Points scaled for perfect central balance (Width 230, Height 270) -->
    <polygon points="256,95 365,160 345,395 167,395 147,160" fill="url(#komaWood)" stroke="#78350f" stroke-width="3" stroke-linejoin="round" />
    <!-- Inner Bevel overlay -->
    <polygon points="256,95 365,160 345,395 167,395 147,160" fill="url(#komaBevel)" mix-blend-mode="overlay" />
    <!-- Inner Border Line -->
    <polygon points="256,112 350,168 333,380 179,380 162,168" fill="none" stroke="#92400e" stroke-width="2" opacity="0.45" />

    <!-- Authentic Shogi Kanji "推" (Oshi) in Lacquer Black Calligraphy -->
    <g fill="#1a120b" stroke="#1a120b" stroke-linejoin="round">
      <!-- Left Radical: 扌 (Tehen) -->
      <path d="M 202,185 L 230,182 M 218,165 L 218,270 Q 218,280 208,282 M 200,260 L 232,228" stroke="#1a120b" stroke-width="9" stroke-linecap="round" fill="none" />
      
      <!-- Right Radical: 隹 (Furutori) -->
      <path d="M 270,162 Q 258,178 246,188 M 266,180 L 306,174 M 276,182 L 276,280 M 276,208 L 314,203 M 276,232 L 312,228 M 276,257 L 314,253 M 252,284 L 324,278" stroke="#1a120b" stroke-width="8" stroke-linecap="round" fill="none" />

      <!-- Subtitle Kanji: "活" (Katsu) -->
      <path d="M 215,312 Q 205,320 198,332 M 210,335 Q 202,345 198,358 M 205,362 L 218,362 M 235,310 L 285,306 M 238,328 L 290,324 M 245,328 L 245,372 M 282,324 L 282,370 M 245,372 L 282,368" stroke="#1a120b" stroke-width="7" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Integrated Oshikatsu 3D Ruby Heart Emblem (Lower Right Accent) -->
  <g transform="translate(315, 305)" filter="url(#heartGlow)">
    <circle cx="36" cy="36" r="34" fill="#140609" stroke="url(#goldRim)" stroke-width="3" />
    <circle cx="36" cy="36" r="30" fill="url(#rubyHeart)" />
    <!-- Heart Path -->
    <path d="M 36,52 C 20,38 15,28 15,21 C 15,13.5 21,8.5 28.5,8.5 C 32.5,8.5 35,10.5 36,12.5 C 37,10.5 39.5,8.5 43.5,8.5 C 51,8.5 57,13.5 57,21 C 57,28 52,38 36,52 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 36,50 C 21,37 17,27 17,21 C 17,14.5 22,10 28.5,10 C 32,10 34.5,12 36,14 C 37.5,12 40,10 43.5,10 C 50,10 55,14.5 55,21 C 55,27 51,37 36,50 Z" fill="url(#rubyHeart)" />
    <!-- Sparkle Highlight -->
    <path d="M 46,14 L 48,19 L 53,21 L 48,23 L 46,28 L 44,23 L 39,21 L 44,19 Z" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
